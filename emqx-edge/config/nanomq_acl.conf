# EMQX Edge Access Control List (ACL) Configuration
# This file defines topic-level permissions for users
#
# Format:
#   {allow|deny}, {user|all}, {pub|sub|pubsub}, {topic_pattern}
#
# Topic patterns support:
#   - Exact match: "baggage/events"
#   - Single-level wildcard (+): "baggage/+/status"
#   - Multi-level wildcard (#): "baggage/#"
#   - Username substitution (%u): "%u/inbox"
#
# Rules are evaluated in order; first match wins

# ============================================================================
# Admin Rules - Full access
# ============================================================================

# Admin can publish and subscribe to all topics
allow, user admin, pubsub, #

# ============================================================================
# System Topics - Restricted access
# ============================================================================

# System topics are reserved for internal use
# Deny all users from publishing to system topics
deny, all, pub, $SYS/#

# Allow all authenticated users to subscribe to system metrics
allow, all, sub, $SYS/#

# ============================================================================
# Service Registration Topics
# (Equivalent to mb-server-node service registry)
# ============================================================================

# Services can publish their registration
allow, all, pub, services/register
allow, all, pub, services/deregister
allow, all, pub, services/+/capabilities
allow, all, pub, services/+/status

# Services can subscribe to service discovery
allow, all, sub, services/+/capabilities
allow, all, sub, services/+/status

# ============================================================================
# Request/Response Topics
# (Equivalent to mb-server-node request-response pattern)
# ============================================================================

# Users can publish requests
allow, all, pub, request/#

# Users can subscribe to their own response inbox
# %u is replaced with the client's username
allow, all, sub, response/%u/#

# Services can subscribe to requests and publish responses
allow, all, sub, request/#
allow, all, pub, response/#

# ============================================================================
# Publish/Subscribe Topics
# (Equivalent to mb-server-node pub/sub)
# ============================================================================

# Standard message topics
allow, all, pubsub, baggage/#
allow, all, pubsub, events/#
allow, all, pubsub, commands/#
allow, all, pubsub, status/#

# ============================================================================
# Heartbeat Topics
# (Equivalent to mb-server-node heartbeat system)
# ============================================================================

# Services can publish heartbeats (using serviceId, not username)
allow, all, pub, heartbeat/+

# Monitoring can subscribe to all heartbeats
allow, all, sub, heartbeat/#

# ============================================================================
# Monitoring Topics
# ============================================================================

# Metrics publishing
allow, all, pub, metrics/#

# Metrics subscription
allow, all, sub, metrics/#

# ============================================================================
# Default Rule - Deny everything else
# ============================================================================

# Deny any access not explicitly allowed above
deny, all, pubsub, #
