# EMQX Edge (NanoMQ) Configuration
# This configuration mirrors the functionality of mb-server-node
#
# Reference: https://docs.emqx.com/en/emqx-edge/latest/config-description/introduction.html

# ============================================================================
# MQTT Listeners Configuration
# ============================================================================

# TCP Listener (equivalent to mb-server-node TCP port)
listeners.tcp {
    bind = "0.0.0.0:1883"
}

# WebSocket Listener (equivalent to mb-server-node WebSocket port)
listeners.ws {
    bind = "0.0.0.0:8083/mqtt"
}

# TLS Listener (equivalent to mb-server-node TLS port)
# Uncomment and configure for production
# listeners.ssl {
#     bind = "0.0.0.0:8883"
#     keyfile = "/opt/emqx-edge/etc/certs/server.key"
#     certfile = "/opt/emqx-edge/etc/certs/server.crt"
#     cacertfile = "/opt/emqx-edge/etc/certs/ca.crt"
# }

# ============================================================================
# HTTP API Configuration (Dashboard and REST API)
# ============================================================================

http_server {
    port = 8081
    # Number of worker threads
    parallel = 32
    # Username for dashboard login
    username = admin
    # Password for dashboard login (change in production!)
    password = public
}

# ============================================================================
# MQTT Protocol Settings
# ============================================================================

mqtt {
    # Maximum packet size (equivalent to message.payload.maxLength in mb-server-node)
    # Default: 1MB, mb-server-node default: 16KB
    max_packet_size = 16KB

    # Maximum QoS level allowed
    max_qos_allowed = 2

    # Maximum topic alias (MQTT 5.0 feature)
    max_topic_alias = 65535

    # Retain message availability
    retain_available = true

    # Wildcard subscription support (equivalent to subscription patterns)
    wildcard_subscription = true

    # Shared subscription support
    shared_subscription = true

    # Keep-alive interval (equivalent to heartbeat in mb-server-node)
    # Client must send PINGREQ within this interval * 1.5
    keepalive_multiplier = 1.25

    # Property availability (MQTT 5.0)
    property_available = true
}

# ============================================================================
# Connection Limits (equivalent to mb-server-node connection settings)
# ============================================================================

# Maximum concurrent connections (equivalent to connection.max.concurrent)
max_conn_count = 100

# ============================================================================
# Logging Configuration (equivalent to mb-server-node logging)
# ============================================================================

log {
    # Log destination: file, console, syslog
    to = console

    # Log level: trace, debug, info, warn, error
    level = info

    # Log directory (when to = file)
    dir = "/opt/emqx-edge/log"

    # Log file name
    file = "nanomq.log"

    # Maximum log file size
    rotation {
        size = 10MB
        count = 5
    }
}

# ============================================================================
# Authentication Configuration
# ============================================================================

# File-based authentication (username/password)
auth {
    # Enable authentication
    allow_anonymous = false

    # No match action: allow or deny
    no_match = deny

    # Deny action: ignore or disconnect
    deny_action = disconnect

    # Cache settings
    cache {
        max_size = 1024
        ttl = 60s
    }
}

# Password file authentication
auth.http {
    enable = false
}

# ============================================================================
# Authorization / ACL Configuration
# ============================================================================

acl {
    # Enable ACL
    enable = true

    # No match action: allow or deny
    no_match = deny

    # Deny action: ignore or disconnect
    deny_action = disconnect

    # Cache settings
    cache {
        max_size = 1024
        ttl = 60s
    }
}

# ============================================================================
# Retain Message Persistence
# ============================================================================

# SQLite-based persistence for retained messages
sqlite {
    enable = true
    disk_cache_size = 102400
    mounted_file_path = "/opt/emqx-edge/data"
    flush_mem_threshold = 100
}

