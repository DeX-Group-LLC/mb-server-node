ports:
  tcp: 3001
  tls: 8001
  ws: 3000
  wss: 8000
host: 'localhost'
# ssl:
#   key: ''        # Path to server private key
#   cert: ''       # Path to server certificate
#   ca: ''         # Path to CA certificate for verifying client certs (mTLS)
#   requestClientCert: false   # Request a client certificate during TLS handshake
#   rejectUnauthorized: false  # Reject connections without a valid client certificate
allowUnsecure: false
logging:
  level: 'info'
  format: 'json'
# ... other default configuration values
auth:
  failure:
    lockout:
      threshold: 5
      duration: 60
rate:
  limit:
    global:
      per:
        service: 0 # 0 means unlimited
        topic: 0
    topic:
      per:
        service: {} # Empty object to allow for dynamic keys
connection:
  max:
    concurrent: 100
  heartbeatRetryTimeout: 30000
  heartbeatDeregisterTimeout: 60000
request:
  response:
    timeout:
      default: 5000
      max: 3600000
max:
  outstanding:
    requests: 10000
message:
  payload:
    maxLength: 16384
monitoring:
  interval: 60000  # Collect metrics every 60 seconds